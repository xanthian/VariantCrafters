name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21 for Minecraft and Java 25 for Gradle
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build
        run: bash ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Artifacts
          path: build/libs/
          if-no-files-found: error
